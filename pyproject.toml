[project]
name = "noryka"
version = "1.0.0"
description = "Noryka — Personal & Autonomous AI Assistant with Multi-Channel Gateway (Telegram, Bale, Discord, Slack), Multi-Provider Fallback, and Advanced Coding Engine"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Noryka Team" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "openai>=1.50.0",
  "certifi>=2024.8.30",
  "truststore>=0.9.2",
  "python-dotenv>=1.0.1",
  "fire>=0.6.0",
  "httpx[socks]>=0.27.2",
  "rich>=13.9.0",
  "tenacity>=8.5.0",
  "tomli-w>=1.0.0",
  "ruamel.yaml>=0.18.6",
  "requests>=2.32.3",
  "jinja2>=3.1.4",
  "pydantic>=2.9.0",
  "prompt_toolkit>=3.0.48",
  "croniter>=3.0.3",
  "snowballstemmer>=2.2.0",
  "packaging>=24.1",
  "Markdown>=3.7",
  "PyJWT[crypto]>=2.9.0",
  "urllib3>=2.2.3,<3",
  "cryptography>=43.0.0",
  "psutil>=6.0.0",
  "websockets>=13.1",
  "pathspec>=0.12.1",
  "fastapi>=0.115.0,<1",
  "uvicorn>=0.31.0,<1",
  "python-multipart>=0.0.9,<1",
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "Pillow>=10.4.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39.0"]
telegram = ["python-telegram-bot[webhooks]>=21.6"]
discord = ["discord.py[voice]>=2.4.0"]
slack = ["slack-bolt>=1.21.0", "slack-sdk>=3.33.0", "aiohttp>=3.10.8"]
mcp = ["mcp>=1.2.0", "starlette>=0.40.0"]
ddgs = ["ddgs>=6.3.0"]
exa = ["exa-py>=1.6.0"]
firecrawl = ["firecrawl-py>=1.5.0"]
edge-tts = ["edge-tts>=6.1.12"]
termux = [
  "python-telegram-bot[webhooks]>=21.6",
  "noryka[mcp]",
]
test = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<6",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<6",
  "pdfplumber>=0.11,<1",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
noryka = "noryka_cli.main:main"
noryka-agent = "agent.legacy_cli:main"
noryka-acp = "acp_adapter.entry:main"

[tool.setuptools.packages.find]
include = [
  "agent",
  "agent.*",
  "tools",
  "tools.*",
  "noryka_cli",
  "noryka_cli.*",
  "gateway",
  "gateway.*",
  "tui_gateway",
  "tui_gateway.*",
  "cron",
  "cron.*",
  "acp_adapter",
  "plugins",
  "plugins.*",
  "providers",
  "providers.*",
  "noryka_platform",
  "noryka_platform.*",
  "pm",
  "pm.*",
]
