name: Bale Gateway Security Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "plugins/platforms/bale/**"
      - "gateway/platforms/**"
      - "tools/approval.py"
      - "tests/plugins/platforms/test_bale.py"
      - ".github/workflows/bale-gateway.yml"
      - "pyproject.toml"
  push:
    branches: [main, "fix/bale-gateway-hardening"]
    paths:
      - "plugins/platforms/bale/**"
      - "gateway/platforms/**"
      - "tools/approval.py"
      - "tests/plugins/platforms/test_bale.py"
      - ".github/workflows/bale-gateway.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bale-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bale-gateway:
    name: Python ${{ matrix.python-version }} / Bale Gateway
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile Gateway and Bale modules
        run: |
          python -m compileall -q gateway/platforms plugins/platforms/bale tools/approval.py

      - name: Run Bale Gateway security regression tests
        run: |
          python -m pytest -q tests/plugins/platforms/test_bale.py

